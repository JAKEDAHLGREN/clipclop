<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipClop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="search-container">
      <input type="text" id="search" placeholder="Search clipboard..." autofocus>
    </div>
    <div id="clips-container"></div>
    <div id="empty-state">
      <div class="empty-icon">📋</div>
      <p>No clips yet</p>
      <span>Copy something and it will appear here</span>
    </div>
    <div id="footer">
      <span id="clip-count">0 clips</span>
      <button id="clear-all">Clear All</button>
    </div>
  </div>
  <div id="toast"></div>
  <script src="renderer.js"></script>
</body>
</html>
